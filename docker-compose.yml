services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: social-network-backend
    ports:
      - "8433:8433"
    environment:
      - DB_PATH=/app/data/database.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8433/api/auth/google/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./back-end/uploads:/app/uploads
      - ./back-end/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: social-network-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8433
    depends_on:
      - backend
    restart: unless-stopped
